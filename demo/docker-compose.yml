services:
  thruster:
    build:
      context: ..
      dockerfile: spaceship-app/Dockerfile
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - SERVER_TYPE=thruster
      - SERVER_URL=http://thruster.local:3000
    networks:
      default:
        aliases:
          - thruster.local
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      retries: 5

